[package]
name = "pneumatic_committer"
version = "0.1.0"
edition = "2021"

[dependencies]
pneumatic_core = { path = ".." }
async-trait = "0.1.88"
tokio = { version = "1.44.2", features = ["full"] }
ed25519-dalek = { version = "2.0", features = ["std"] }
chrono = "0.4.41"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
rand = "0.8"

[dev-dependencies]
tempfile = "3.20.0"
dashmap = "7.0.0-rc0"
