[workspace]
members = [
    ".",
    "sentinel",
    "executor",
    "finalizer",
    "committer",
    "node-server",
]
resolver = "2"

[package]
name = "pneumatic_core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde_json = "1.0.140"
rmp-serde = "1.3.0"
serde = { version = "1.0.219", features = ["derive"] }
dashmap = "7.0.0-rc0"
strum = "0.27.1"
strum_macros = "0.27.1"
moka = { version = "0.12.10", features = ["sync"] }
once_cell = "1.21.3"
chrono = "0.4.41"
file-lock = "2.1.11"
ring = "0.17.14"
ed25519-dalek = "2.0"
getrandom = "0.2"
rand = "0.8"
tokio = { version = "1.44.2", features = ["full"] }
tokio-macros = "2.5.0"
tokio-stream = "0.1.17"
async-trait = "0.1.88"
futures = "0.3"
hex = "0.4"
aes-gcm = "0.11.0"
x25519-dalek = { version = "3.0.0", features = ["static_secrets", "getrandom"] }
hkdf = "0.12"
sha2 = "0.10"
# S1.2 (shielded Tier 1): the off-circuit Poseidon1 reference hash over the
# Pasta base field Fp (`src/shielded/poseidon.rs`). `ff` provides the `Field` /
# `PrimeField` / `Algebra` traits it calls directly (inverse, from_repr, square);
# `pasta_curves` is the base-field crate. Both are already resolved transitively
# by halo2_proofs (a dev-dependency, S1.1), so promoting only these two small
# crates adds zero new packages to Cargo.lock and `halo2_proofs` itself never
# enters the production link graph. Pinned to the versions already resolved.
pasta_curves = "=0.5.2"
ff = "=0.13.1"

# Quantum-secure signatures (ML-DSA / Dilithium, FIPS 204) and key encapsulation
# (ML-KEM / Kyber, FIPS 203) — combined with the classical Ed25519 / X25519 primitives
# in the "hybrid / N = N+1" strategy (see src/crypto.rs Phase 7). Bound to the PQClean
# reference implementations via the rustpq FFI bindings (MIT/Apache-2.0).
pqcrypto-mldsa = "0.1.2"
pqcrypto-mlkem = "0.1.1"
pqcrypto-traits = "0.3"
# Shared-secret auth over the data channel (HMAC-SHA256). hmac re-exports
# `digest` 0.10, which sha2 already pins — so no version divergence.
hmac = "0.12"
# getuid() for per-UID runtime-dir resolution (src/conns/uds.rs).
libc = "0.2"
# Reticulum Network Stack (rns-rs). Pinned exactly: NodeConfig has ~45 fields
# and no Default, so any version bump is an API-migration event.
rns-net = "=0.7.0"
rns-crypto = "=0.1.9"
rns-core = "=0.1.16"

[dev-dependencies]
tempfile = "3.20.0"
# S1.1 (shielded Tier 1): Halo2 proving/verifying stack, used only by the
# gated live-prove smoke test in `src/shielded/mod.rs` `#[cfg(test)]`. Kept as a
# dev-dependency so `cargo check --workspace` (non-test) stays clean and the
# halo2 curve crates don't enter the production link graph. When the network
# verifier (`src/shielded/verify.rs`, S2.2) and the circuit (`circuit.rs`, S2.1)
# move halo2 into non-test code, promote it to `[dependencies]` and note that
# move in that item's Done note. Pinned exactly to avoid an API surprise between
# halo2 releases (mirrors the `=`-pin philosophy used for rns-* here).
halo2_proofs = "=0.3.5"
# `ff`'s `Field` trait (bound on `halo2_proofs::Circuit<F>` and used for field
# arithmetic on the pasta `Fp` field in the gated smoke test). `ff 0.13.1` is
# already pulled in transitively by halo2_proofs (via pasta_curves), so pinning
# it here as a direct dependency adds zero new packages to Cargo.lock.
ff = "=0.13.1"
