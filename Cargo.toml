[workspace]
members = [
    ".",
    "sentinel",
    "executor",
    "finalizer",
    "committer",
    "node-server",
]
resolver = "2"

[package]
name = "pneumatic_core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde_json = "1.0.140"
rmp-serde = "1.3.0"
serde = { version = "1.0.219", features = ["derive"] }
dashmap = "7.0.0-rc0"
strum = "0.27.1"
strum_macros = "0.27.1"
moka = { version = "0.12.10", features = ["sync"] }
once_cell = "1.21.3"
chrono = "0.4.41"
file-lock = "2.1.11"
ring = "0.17.14"
ed25519-dalek = "2.0"
getrandom = "0.2"
rand = "0.8"
tokio = { version = "1.44.2", features = ["full"] }
tokio-macros = "2.5.0"
tokio-stream = "0.1.17"
async-trait = "0.1.88"
futures = "0.3"
hex = "0.4"
aes-gcm = "0.11.0"
x25519-dalek = { version = "3.0.0", features = ["static_secrets", "getrandom"] }
hkdf = "0.12"
sha2 = "0.10"
# Shared-secret auth over the data channel (HMAC-SHA256). hmac re-exports
# `digest` 0.10, which sha2 already pins — so no version divergence.
hmac = "0.12"
# getuid() for per-UID runtime-dir resolution (src/conns/uds.rs).
libc = "0.2"
# Reticulum Network Stack (rns-rs). Pinned exactly: NodeConfig has ~45 fields
# and no Default, so any version bump is an API-migration event.
rns-net = "=0.7.0"
rns-crypto = "=0.1.9"
rns-core = "=0.1.16"

[dev-dependencies]
tempfile = "3.20.0"
