[package]
name = "pneumatic_sentinel"
version = "0.1.0"
edition = "2021"

[dependencies]
pneumatic_core = { path = ".." }
async-trait = "0.1.88"
tokio = { version = "1.44.2", features = ["full"] }
dashmap = "7.0.0-rc2"
serde_json = "1"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
